name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install Pillow
      - name: Compile check
        run: python -m compileall karousel
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Render sample (smoke test)
        run: |
          python -m karousel.cli examples/sample.md -o out/
          ls out/
